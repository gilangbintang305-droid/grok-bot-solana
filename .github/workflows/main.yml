- name: Force JVM 17
        run: |
          cat > "$RUNNER_TEMP/force-jvm.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach {
                  if (it.class.name.contains("KotlinCompile")) {
                      it.kotlinOptions.jvmTarget = "17"
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --stop
          gradle -I "$RUNNER_TEMP/force-jvm.gradle" assembleDebug --no-daemon --stacktrace
